<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Click Detection Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { color: #333; }
    .container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .image-container {
      position: relative;
      border: 2px solid #007bff;
      display: inline-block;
      cursor: crosshair;
    }
    img {
      display: block;
      max-width: 600px;
    }
    .detected-box {
      position: absolute;
      border: 2px solid red;
      background: rgba(255, 0, 0, 0.1);
      box-sizing: border-box;
    }
    .results {
      flex: 1;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .test-point {
      margin: 10px 0;
      padding: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    .test-point:hover {
      background: #e3f2fd;
    }
    .result {
      margin: 10px 0;
      padding: 10px;
      border-radius: 4px;
    }
    .success { background: #d4edda; color: #155724; }
    .failure { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>Click-to-Detect Test</h1>
  <p>Click anywhere on the image to test point-based detection, or use the test points below.</p>
  
  <div class="container">
    <div>
      <div class="image-container" id="imageContainer">
        <img id="testImage" src="fixtures/login-page.png" alt="Test login page">
      </div>
    </div>
    
    <div class="results">
      <h2>Test Points</h2>
      <div class="test-point" onclick="testPoint(270, 260)">
        📝 Username field (~270, 260)
      </div>
      <div class="test-point" onclick="testPoint(270, 385)">
        🔑 Password field (~270, 385)
      </div>
      <div class="test-point" onclick="testPoint(215, 475)">
        🔗 "FORGOT YOUR PASSWORD?" link (~215, 475)
      </div>
      <div class="test-point" onclick="testPoint(270, 565)">
        🔘 SIGN IN button (~270, 565)
      </div>
      <div class="test-point" onclick="testPoint(50, 50)">
        ❌ Empty background (~50, 50)
      </div>
      
      <h2>Results</h2>
      <div id="results"></div>
    </div>
  </div>

  <script type="module">
    import { detectAtPoint } from './src/detector.ts';

    let imageData = null;
    const img = document.getElementById('testImage');
    const container = document.getElementById('imageContainer');
    const resultsDiv = document.getElementById('results');

    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      imageData = canvas.toDataURL();
    };

    container.addEventListener('click', async (e) => {
      if (!imageData) {
        alert('Image not loaded yet');
        return;
      }

      const rect = img.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      
      const scaleX = img.naturalWidth / img.offsetWidth;
      const scaleY = img.naturalHeight / img.offsetHeight;
      const naturalX = Math.round(clickX * scaleX);
      const naturalY = Math.round(clickY * scaleY);

      await testPoint(naturalX, naturalY);
    });

    window.testPoint = async function(x, y) {
      if (!imageData) {
        alert('Image not loaded yet');
        return;
      }

      const startTime = performance.now();
      const result = await detectAtPoint(imageData, x, y);
      const duration = Math.round(performance.now() - startTime);

      // Clear previous boxes
      document.querySelectorAll('.detected-box').forEach(el => el.remove());

      let resultHtml;
      if (result) {
        // Draw the detected box
        const scaleX = img.offsetWidth / img.naturalWidth;
        const scaleY = img.offsetHeight / img.naturalHeight;
        
        const box = document.createElement('div');
        box.className = 'detected-box';
        box.style.left = (result.x * scaleX) + 'px';
        box.style.top = (result.y * scaleY) + 'px';
        box.style.width = (result.width * scaleX) + 'px';
        box.style.height = (result.height * scaleY) + 'px';
        container.appendChild(box);

        resultHtml = `
          <div class="result success">
            <strong>✓ Detected at (${x}, ${y})</strong><br>
            Type: <strong>${result.type.toUpperCase()}</strong><br>
            Bounds: (${result.x}, ${result.y}, ${result.width}×${result.height})<br>
            Label: ${result.label}<br>
            Time: ${duration}ms
          </div>
        `;
      } else {
        resultHtml = `
          <div class="result failure">
            <strong>✗ Nothing detected at (${x}, ${y})</strong><br>
            Time: ${duration}ms
          </div>
        `;
      }

      resultsDiv.innerHTML = resultHtml + resultsDiv.innerHTML;
    };
  </script>
</body>
</html>
