<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detector Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    .image-panel {
      flex: 1;
      position: relative;
    }
    .results-panel {
      flex: 1;
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
    }
    #testImage {
      max-width: 100%;
      border: 2px solid #ccc;
      border-radius: 4px;
    }
    .detection-box {
      position: absolute;
      border: 3px solid #ff0000;
      box-sizing: border-box;
      pointer-events: none;
    }
    .detection-label {
      position: absolute;
      background: #ff0000;
      color: white;
      padding: 2px 6px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .result-item {
      background: white;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border-left: 4px solid #007bff;
    }
    .error { border-left-color: #dc3545; }
    .success { border-left-color: #28a745; }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin: 10px 10px 10px 0;
    }
    button:hover {
      background: #0056b3;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .stat-box {
      background: white;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
    }
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #007bff;
    }
    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>Auto-Detector Test Page</h1>
  <p>Test the detector against login-page.png or any screenshot</p>
  
  <div>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="loadTestImage()">Load fixtures/login-page.png</button>
    <button onclick="runDetection()">Run Detection</button>
  </div>
  
  <div class="container">
    <div class="image-panel">
      <h2>Image Preview</h2>
      <div style="position: relative; display: inline-block;">
        <img id="testImage" src="" alt="Upload an image to test">
        <div id="detectionOverlay"></div>
      </div>
    </div>
    
    <div class="results-panel">
      <h2>Detection Results</h2>
      <div class="stats" id="stats"></div>
      <div id="results"></div>
    </div>
  </div>
  
  <script type="module">
    // Import detector (inline for testing)
    const detector = {
      async detectComponents(imageData) {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              resolve([]);
              return;
            }

            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const rectangles = this.detectRectangles(canvas, ctx);
            const objects = this.rectanglesToObjects(rectangles);
            resolve(objects);
          };
          img.onerror = () => resolve([]);
          img.src = imageData;
        });
      },
      
      detectRectangles(canvas, ctx) {
        const width = canvas.width;
        const height = canvas.height;
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;

        const edgeMap = this.detectEdges(data, width, height);
        const rectangles = this.findFormComponents(edgeMap, data, width, height);
        
        return rectangles;
      },
      
      detectEdges(data, width, height) {
        const edges = Array(height).fill(null).map(() => Array(width).fill(false));
        const threshold = 30;

        for (let y = 1; y < height - 1; y++) {
          for (let x = 1; x < width - 1; x++) {
            const idx = (y * width + x) * 4;
            const gray = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;

            const neighbors = [
              (data[((y - 1) * width + x) * 4] + data[((y - 1) * width + x) * 4 + 1] + data[((y - 1) * width + x) * 4 + 2]) / 3,
              (data[((y + 1) * width + x) * 4] + data[((y + 1) * width + x) * 4 + 1] + data[((y + 1) * width + x) * 4 + 2]) / 3,
              (data[(y * width + (x - 1)) * 4] + data[(y * width + (x - 1)) * 4 + 1] + data[(y * width + (x - 1)) * 4 + 2]) / 3,
              (data[(y * width + (x + 1)) * 4] + data[(y * width + (x + 1)) * 4 + 1] + data[(y * width + (x + 1)) * 4 + 2]) / 3,
            ];

            const maxDiff = Math.max(...neighbors.map(n => Math.abs(gray - n)));
            if (maxDiff > threshold) {
              edges[y][x] = true;
            }
          }
        }

        return edges;
      },
      
      findFormComponents(edges, pixels, width, height) {
        const rectangles = [];
        
        const minWidth = 100;
        const minHeight = 30;
        const maxWidth = width * 0.9;
        const maxHeight = height * 0.15;
        
        const horizontalRuns = [];
        
        for (let y = 0; y < height; y++) {
          let runStart = -1;
          let runLength = 0;
          
          for (let x = 0; x < width; x++) {
            if (edges[y][x]) {
              if (runStart === -1) {
                runStart = x;
                runLength = 1;
              } else {
                runLength++;
              }
            } else {
              if (runLength >= minWidth * 0.6) {
                horizontalRuns.push({y, x1: runStart, x2: runStart + runLength});
              }
              runStart = -1;
              runLength = 0;
            }
          }
          if (runLength >= minWidth * 0.6) {
            horizontalRuns.push({y, x1: runStart, x2: runStart + runLength});
          }
        }
        
        for (let i = 0; i < horizontalRuns.length; i++) {
          const top = horizontalRuns[i];
          
          for (let j = i + 1; j < horizontalRuns.length; j++) {
            const bottom = horizontalRuns[j];
            const h = bottom.y - top.y;
            
            if (h < minHeight || h > maxHeight) continue;
            
            const x1 = Math.max(top.x1, bottom.x1);
            const x2 = Math.min(top.x2, bottom.x2);
            const w = x2 - x1;
            
            if (w < minWidth || w > maxWidth) continue;
            
            const leftEdgeScore = this.scoreVerticalEdge(edges, x1, top.y, h);
            const rightEdgeScore = this.scoreVerticalEdge(edges, x2, top.y, h);
            
            if (leftEdgeScore > 0.3 && rightEdgeScore > 0.3) {
              const confidence = (leftEdgeScore + rightEdgeScore) / 2;
              rectangles.push({
                x: x1,
                y: top.y,
                width: w,
                height: h,
                confidence
              });
            }
          }
        }
        
        return this.filterRectangles(rectangles, pixels, width, height);
      },
      
      scoreVerticalEdge(edges, x, y, height) {
        let edgeCount = 0;
        const samples = Math.min(height, 50);
        const step = Math.max(1, Math.floor(height / samples));
        
        for (let i = 0; i < height; i += step) {
          const py = y + i;
          if (py >= 0 && py < edges.length && x >= 0 && x < edges[0].length) {
            if (edges[py][x] || (x > 0 && edges[py][x-1]) || (x < edges[0].length-1 && edges[py][x+1])) {
              edgeCount++;
            }
          }
        }
        
        return edgeCount / (height / step);
      },
      
      filterRectangles(rectangles, pixels, width, height) {
        const filtered = rectangles.filter(rect => {
          if (rect.width < 80 || rect.height < 25) return false;
          if (rect.width > width * 0.9 || rect.height > height * 0.3) return false;
          
          const uniformity = this.measureUniformity(pixels, width, rect);
          if (uniformity < 0.5) return false;
          
          return true;
        });
        
        const sorted = filtered.sort((a, b) => {
          const scoreA = a.confidence * Math.sqrt(a.width * a.height);
          const scoreB = b.confidence * Math.sqrt(b.width * b.height);
          return scoreB - scoreA;
        });
        
        const final = [];
        
        for (const rect of sorted) {
          const overlaps = final.some(existing => {
            const overlapArea = this.getOverlapArea(rect, existing);
            const rectArea = rect.width * rect.height;
            const existingArea = existing.width * existing.height;
            return overlapArea > Math.min(rectArea, existingArea) * 0.5;
          });
          
          if (!overlaps && final.length < 6) {
            final.push(rect);
          }
        }
        
        return final;
      },
      
      measureUniformity(pixels, width, rect) {
        const samples = 20;
        const colors = [];
        
        const stepX = Math.max(1, Math.floor(rect.width / samples));
        const stepY = Math.max(1, Math.floor(rect.height / samples));
        
        for (let dy = 0; dy < rect.height; dy += stepY) {
          for (let dx = 0; dx < rect.width; dx += stepX) {
            const x = rect.x + dx;
            const y = rect.y + dy;
            if (x >= 0 && x < width && y >= 0 && y < pixels.length / width / 4) {
              const idx = (y * width + x) * 4;
              const gray = (pixels[idx] + pixels[idx + 1] + pixels[idx + 2]) / 3;
              colors.push(gray);
            }
          }
        }
        
        if (colors.length === 0) return 0;
        
        const mean = colors.reduce((a, b) => a + b, 0) / colors.length;
        const variance = colors.reduce((sum, c) => sum + Math.pow(c - mean, 2), 0) / colors.length;
        const stdDev = Math.sqrt(variance);
        
        return Math.max(0, 1 - (stdDev / 80));
      },
      
      getOverlapArea(a, b) {
        const x1 = Math.max(a.x, b.x);
        const y1 = Math.max(a.y, b.y);
        const x2 = Math.min(a.x + a.width, b.x + b.width);
        const y2 = Math.min(a.y + a.height, b.y + b.height);
        
        if (x2 <= x1 || y2 <= y1) return 0;
        return (x2 - x1) * (y2 - y1);
      },
      
      rectanglesToObjects(rectangles) {
        const sorted = [...rectangles].sort((a, b) => a.y - b.y);
        
        return sorted.map((rect, index) => {
          const type = this.inferType(rect, index, sorted.length);
          return {
            id: `obj_${index}`,
            x: rect.x,
            y: rect.y,
            width: rect.width,
            height: rect.height,
            type,
            label: `${type}_${index + 1}`,
            confidence: rect.confidence,
          };
        });
      },
      
      inferType(rect, index, total) {
        const aspectRatio = rect.width / rect.height;
        const area = rect.width * rect.height;
        const height = rect.height;
        
        if (height >= 45 && height <= 100 && aspectRatio > 3 && area > 15000) {
          return 'button';
        }
        
        if (height < 45 && aspectRatio > 4 && area < 12000) {
          return 'link';
        }
        
        if (height >= 30 && height <= 70 && aspectRatio > 3 && aspectRatio < 10) {
          return 'text';
        }
        
        return 'text';
      }
    };
    
    window.detector = detector;
  </script>
  
  <script>
    let currentImageData = null;
    let detectedObjects = [];
    
    document.getElementById('imageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          currentImageData = event.target.result;
          document.getElementById('testImage').src = currentImageData;
        };
        reader.readAsDataURL(file);
      }
    });
    
    function loadTestImage() {
      currentImageData = 'fixtures/login-page.png';
      document.getElementById('testImage').src = currentImageData;
    }
    
    async function runDetection() {
      if (!currentImageData) {
        alert('Please load an image first');
        return;
      }
      
      document.getElementById('results').innerHTML = '<p>Running detection...</p>';
      
      try {
        detectedObjects = await window.detector.detectComponents(currentImageData);
        displayResults(detectedObjects);
        drawDetectionBoxes(detectedObjects);
      } catch (err) {
        document.getElementById('results').innerHTML = `<div class="result-item error">Error: ${err.message}</div>`;
      }
    }
    
    function displayResults(objects) {
      const typeCounts = {
        text: 0,
        password: 0,
        button: 0,
        link: 0,
        radio: 0,
        checkbox: 0,
      };
      
      objects.forEach(obj => {
        typeCounts[obj.type] = (typeCounts[obj.type] || 0) + 1;
      });
      
      const inputCount = typeCounts.text + typeCounts.password;
      
      // Expected values
      const expected = {
        total: [3, 5],
        inputs: [2, 3],
        buttons: 1,
        links: 1,
      };
      
      const totalOk = objects.length >= expected.total[0] && objects.length <= expected.total[1];
      const inputsOk = inputCount >= expected.inputs[0] && inputCount <= expected.inputs[1];
      const buttonsOk = typeCounts.button === expected.buttons;
      const linksOk = typeCounts.link === expected.links;
      const noForbidden = typeCounts.radio === 0 && typeCounts.checkbox === 0;
      
      const allOk = totalOk && inputsOk && buttonsOk && linksOk && noForbidden;
      
      document.getElementById('stats').innerHTML = `
        <div class="stat-box">
          <div class="stat-value">${objects.length}</div>
          <div class="stat-label">Total Objects ${totalOk ? '✓' : '✗'}</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${inputCount}</div>
          <div class="stat-label">Input Fields ${inputsOk ? '✓' : '✗'}</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${typeCounts.button}</div>
          <div class="stat-label">Buttons ${buttonsOk ? '✓' : '✗'}</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${typeCounts.link}</div>
          <div class="stat-label">Links ${linksOk ? '✓' : '✗'}</div>
        </div>
      `;
      
      let html = `<h3 style="color: ${allOk ? '#28a745' : '#dc3545'}">${allOk ? '✅ PASSED' : '❌ FAILED'}</h3>`;
      
      objects.forEach((obj, i) => {
        html += `
          <div class="result-item">
            <strong>${i + 1}. ${obj.type.toUpperCase()}</strong><br>
            Position: (${obj.x}, ${obj.y})<br>
            Size: ${obj.width}×${obj.height}<br>
            Confidence: ${obj.confidence.toFixed(2)}
          </div>
        `;
      });
      
      if (!allOk) {
        html += '<div class="result-item error"><strong>Issues:</strong><ul>';
        if (!totalOk) html += `<li>Total count ${objects.length} not in [${expected.total[0]}, ${expected.total[1]}]</li>`;
        if (!inputsOk) html += `<li>Input count ${inputCount} not in [${expected.inputs[0]}, ${expected.inputs[1]}]</li>`;
        if (!buttonsOk) html += `<li>Expected ${expected.buttons} button, found ${typeCounts.button}</li>`;
        if (!linksOk) html += `<li>Expected ${expected.links} link, found ${typeCounts.link}</li>`;
        if (!noForbidden) html += `<li>Found forbidden types (radio/checkbox)</li>`;
        html += '</ul></div>';
      }
      
      document.getElementById('results').innerHTML = html;
    }
    
    function drawDetectionBoxes(objects) {
      const img = document.getElementById('testImage');
      const overlay = document.getElementById('detectionOverlay');
      overlay.innerHTML = '';
      
      const scaleX = img.offsetWidth / img.naturalWidth;
      const scaleY = img.offsetHeight / img.naturalHeight;
      
      objects.forEach((obj, i) => {
        const box = document.createElement('div');
        box.className = 'detection-box';
        box.style.left = (obj.x * scaleX) + 'px';
        box.style.top = (obj.y * scaleY) + 'px';
        box.style.width = (obj.width * scaleX) + 'px';
        box.style.height = (obj.height * scaleY) + 'px';
        
        const label = document.createElement('div');
        label.className = 'detection-label';
        label.textContent = `${i + 1}: ${obj.type}`;
        label.style.left = (obj.x * scaleX) + 'px';
        label.style.top = ((obj.y * scaleY) - 20) + 'px';
        
        overlay.appendChild(box);
        overlay.appendChild(label);
      });
    }
  </script>
</body>
</html>
